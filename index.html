<body>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharModal(event)">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitulo"></h3>
      <span class="modal-header-sub" id="modalSubtitulo"></span>
      <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer"><span id="modalTotalLabel">Total</span><span id="modalTotal"></span></div>
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-icon">🗑️</div>
    <div class="confirm-titulo">Excluir lançamento?</div>
    <div class="confirm-desc" id="confirmDesc"></div>
    <div class="confirm-btns">
      <button class="confirm-btn-cancel" onclick="fecharConfirm()">Cancelar</button>
      <button class="confirm-btn-del" id="confirmDelBtn" onclick="confirmarDelete()">Excluir</button>
    </div>
  </div>
</div>

<div class="lanc-overlay" id="editOverlay" onclick="if(event.target===this)fecharEdit()">
  <div class="lanc-box">
    <div class="lanc-header">
      <h3>Editar Lançamento</h3>
      <button class="modal-close" onclick="fecharEdit()">✕</button>
    </div>
    <div class="lanc-body">
      <div class="lanc-toggle">
        <button class="lanc-toggle-btn" id="editBadge" disabled style="cursor:default;grid-column:span 2;text-align:center"></button>
      </div>
      <div class="lanc-row2">
        <div class="lanc-field">
          <label>Data</label>
          <input type="date" id="editData">
        </div>
        <div class="lanc-field">
          <label>Valor (R$)</label>
          <input type="number" id="editValor" min="0" step="0.01">
        </div>
      </div>
      <div class="lanc-field">
        <label>Categoria</label>
        <select id="editCategoria"></select>
      </div>
      <div class="lanc-field" id="editCampoEstab">
        <label>Estabelecimento</label>
        <input type="text" id="editEstab">
      </div>
      <div class="lanc-field" id="editCampoConta">
        <label>Conta / Cartão</label>
        <select id="editConta"></select>
      </div>
      <div class="lanc-field" id="editCampoPagador" style="display:none">
        <label>Pagador / Descrição</label>
        <input type="text" id="editPagador">
      </div>
      <div class="lanc-status" id="editStatus"></div>
    </div>
    <div class="lanc-footer">
      <button class="lanc-btn-cancel" onclick="fecharEdit()">Cancelar</button>
      <button class="lanc-btn-save" id="editSaveBtn" onclick="salvarEdicao()">Salvar alterações</button>
    </div>
  </div>
</div>

<div class="analise-overlay" id="analiseMesOverlay" onclick="if(event.target===this)fecharAnaliseMes()">
  <div class="analise-modal">
    <div class="analise-modal-header">
      <h3 id="analiseMesTitulo">Análise do mês</h3>
      <button class="modal-close" onclick="fecharAnaliseMes()">✕</button>
    </div>
    <div class="analise-modal-body" id="analiseMesBody"></div>
  </div>
</div>

<div class="lanc-overlay" id="lancOverlay" onclick="if(event.target===this)fecharLanc()">
  <div class="lanc-box">
    <div class="lanc-header">
      <h3 id="lancTitulo">Novo Lançamento</h3>
      <button class="modal-close" onclick="fecharLanc()">✕</button>
    </div>
    <div class="lanc-body">
      <div class="lanc-toggle">
        <button class="lanc-toggle-btn active-desp" id="btnDesp" onclick="setTipoLanc('DESPESAS')">💸 Despesa</button>
        <button class="lanc-toggle-btn" id="btnRec" onclick="setTipoLanc('RECEITAS')">💰 Receita</button>
      </div>
      <div class="lanc-row2">
        <div class="lanc-field">
          <label>Data</label>
          <input type="date" id="lancData">
        </div>
        <div class="lanc-field">
          <label>Valor (R$)</label>
          <input type="number" id="lancValor" placeholder="0,00" min="0" step="0.01">
        </div>
      </div>
      <div class="lanc-field" id="lancCampoCategoria">
        <label>Categoria</label>
        <select id="lancCategoria"></select>
      </div>
      <div class="lanc-field" id="lancCampoEstab" style="">
        <label>Estabelecimento</label>
        <input type="text" id="lancEstab" placeholder="ex: Supermercado BH">
      </div>
      <div class="lanc-field" id="lancCampoConta" style="">
        <label>Conta / Cartão</label>
        <select id="lancConta"></select>
      </div>
      <div class="lanc-field" id="lancCampoPagador" style="display:none">
        <label>Pagador / Descrição</label>
        <input type="text" id="lancPagador" placeholder="ex: Aluminas, Freelance...">
      </div>
      <div class="lanc-status" id="lancStatus"></div>
    </div>
    <div class="lanc-footer">
      <button class="lanc-btn-cancel" onclick="fecharLanc()">Cancelar</button>
      <button class="lanc-btn-save" id="lancSaveBtn" onclick="salvarLanc()">Salvar</button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycby4ryqxYQ5Xy1x1CTipOrxk1CSBD1SU7VaZhIfbJmqNYl7a_e9fA79eci-1UfjZroLJ/exec";
const ABA_DESPESAS = "DESPESAS";
const ABA_RECEITAS = "RECEITAS";
const MESES_CONFIG = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function SALARIO_BRUTO(mes){
  const idx = MESES_CONFIG.indexOf(mes);
  return idx >= 7 ? 4000 : 3200; // Agosto em diante = 4000
}

const CORES = {
  "Alimentação":    {hex:"#f59e0b",cls:"b-ali"},
  "Outros":         {hex:"#64748b",cls:"b-out"},
  "Internet":       {hex:"#3b82f6",cls:"b-net"},
  "Stream/Jogo":    {hex:"#8b5cf6",cls:"b-str"},
  "Assinatura/Tech":{hex:"#6366f1",cls:"b-acc"},
  "Caixinha Paloma":{hex:"#14b8a6",cls:"b-cai"},
  "Caixinha Praia": {hex:"#14b8a6",cls:"b-cai"},
  "Dentista":       {hex:"#10b981",cls:"b-den"},
};
// Paleta automática para categorias novas
const PALETA=["#e879f9","#fb7185","#38bdf8","#a3e635","#fb923c","#f472b6","#4ade80","#facc15","#c084fc","#34d399"];
const _corCache={};
function corHex(c){
  if(CORES[c]) return CORES[c].hex;
  if(!_corCache[c]){
    const idx=Object.keys(_corCache).length%PALETA.length;
    _corCache[c]=PALETA[idx];
  }
  return _corCache[c];
}
function corCls(c){
  if(CORES[c]) return CORES[c].cls;
  return "b-dyn";
}
function fmt(v){return"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function parseData(dataRaw){
  const mesNomes={1:"Janeiro",2:"Fevereiro",3:"Março",4:"Abril",5:"Maio",6:"Junho",7:"Julho",8:"Agosto",9:"Setembro",10:"Outubro",11:"Novembro",12:"Dezembro"};
  if(!dataRaw) return null;
  let d;
  if(typeof dataRaw==="string"&&dataRaw.includes("T")) d=new Date(dataRaw);
  else if(typeof dataRaw==="string"&&dataRaw.includes("/")){ const p=dataRaw.split("/"); d=new Date(2026,parseInt(p[1])-1,parseInt(p[0])); }
  else if(typeof dataRaw==="number") d=new Date(Math.round((dataRaw-25569)*86400*1000));
  else return null;
  return {
    mesNome: mesNomes[d.getMonth()+1]||"",
    dataStr: String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")
  };
}

// ── TEMA ──────────────────────────────────────────────────────
function toggleTheme(){
  const html=document.documentElement;
  const isDark=html.getAttribute("data-theme")==="dark";
  html.setAttribute("data-theme",isDark?"light":"dark");
  document.getElementById("themeBtn").textContent=isDark?"🌙":"☀️";
  localStorage.setItem("theme",isDark?"light":"dark");
  // Atualiza cores dos charts
  if(chartPizza) { const d=dadosPorMes[mesSelecionado]; if(d) renderMes(); }
  if(chartConsolid&&mesSelecionado==="CONSOLIDADO") renderConsolidado();
}
(function initTheme(){
  const saved=localStorage.getItem("theme")||"dark";
  document.documentElement.setAttribute("data-theme",saved);
  document.addEventListener("DOMContentLoaded",()=>{
    const btn=document.getElementById("themeBtn");
    if(btn) btn.textContent=saved==="dark"?"☀️":"🌙";
  });
})();

let dadosPorMes={}, receitasPorMes={}, receitasDetalhe={};
let mesSelecionado="", filtroAtivo="Todos";
let chartPizza=null, chartDia=null, chartConsolid=null;

// ── SYNC ──────────────────────────────────────────────────────
async function sincronizar(){
  setSyncStatus("syncing");
  document.getElementById("mainContent").innerHTML=`<div class="loading-msg"><div class="spinner"></div>Buscando dados...</div>`;
  try{
    const [resD,resR]=await Promise.all([
      fetch(API_URL+"?aba="+encodeURIComponent(ABA_DESPESAS)+"&token=joao771964").then(r=>r.json()),
      fetch(API_URL+"?aba="+encodeURIComponent(ABA_RECEITAS)+"&token=joao771964").then(r=>r.json())
    ]);
    processarDados(resD,resR);
    setSyncStatus("ok");
    const n=new Date();
    document.getElementById("lastSync").textContent="sync "+String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
  }catch(e){
    setSyncStatus("erro");
    document.getElementById("mainContent").innerHTML=`<div class="erro-msg"><div style="font-size:32px">⚠️</div><p style="margin-top:10px;font-size:13px">Erro: ${e.message}</p><button onclick="sincronizar()" style="margin-top:16px;padding:9px 22px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;font-weight:500">Tentar novamente</button></div>`;
  }
}
function setSyncStatus(s){
  document.getElementById("syncDot").className="sync-dot"+(s==="syncing"?" syncing":s==="erro"?" erro":"");
  document.getElementById("syncBtn").className="sync-btn"+(s==="syncing"?" loading":"");
}

// ── PROCESSAR ─────────────────────────────────────────────────
function processarDados(rawDesp,rawRec){
  dadosPorMes={}; receitasPorMes={}; receitasDetalhe={};
  rawDesp.forEach((row,i)=>{
    const p=parseData(row["DATA"]); if(!p||!p.mesNome) return;
    const valor=parseFloat(row["VALOR"])||0; if(!valor) return;
    if(!dadosPorMes[p.mesNome]) dadosPorMes[p.mesNome]=[];
    dadosPorMes[p.mesNome].push({rowIndex:i,data:p.dataStr,cat:(row["CATEGORIA"]||"Outros").trim(),valor,conta:(row["CONTA"]||"").trim(),estab:(row["ESTABELECIMENTO"]||"").trim()});
  });
  rawRec.forEach((row,i)=>{
    const p=parseData(row["DATA"]); if(!p||!p.mesNome) return;
    const valor=parseFloat(row["VALOR"])||0; if(!valor) return;
    receitasPorMes[p.mesNome]=(receitasPorMes[p.mesNome]||0)+valor;
    if(!receitasDetalhe[p.mesNome]) receitasDetalhe[p.mesNome]=[];
    receitasDetalhe[p.mesNome].push({rowIndex:i,cat:(row["CATEGORIA"]||"Receita").trim(),valor,pagador:(row["PAGADOR"]||"").trim(),data:p.dataStr});
  });
  const mesesComDados=MESES_CONFIG.filter(m=>dadosPorMes[m]||receitasPorMes[m]);
  mesSelecionado=mesesComDados[mesesComDados.length-1]||MESES_CONFIG[0];
  filtroAtivo="Todos";
  renderTabs();
  renderMes();
}

// ── TABS ──────────────────────────────────────────────────────
function renderTabs(){
  const bar=document.getElementById("monthBar");
  bar.innerHTML="";
  MESES_CONFIG.forEach(m=>{
    const temDados=!!(dadosPorMes[m]||receitasPorMes[m]);
    const btn=document.createElement("button");
    btn.className="month-tab"+(m===mesSelecionado?" active":"")+(!temDados?" vazio":"");
    btn.innerHTML=m+(temDados?`<span class="dot"></span>`:"");
    if(temDados) btn.onclick=()=>{ mesSelecionado=m; filtroAtivo="Todos"; renderTabs(); renderMes(); };
    bar.appendChild(btn);
  });
  const sep1=document.createElement("div"); sep1.className="tab-sep"; bar.appendChild(sep1);
  const btnC=document.createElement("button");
  btnC.className="month-tab special"+(mesSelecionado==="CONSOLIDADO"?" active":"");
  btnC.textContent="▦ Consolidado";
  btnC.onclick=()=>{ mesSelecionado="CONSOLIDADO"; renderTabs(); renderConsolidado(); };
  bar.appendChild(btnC);
  const sep2=document.createElement("div"); sep2.className="tab-sep"; bar.appendChild(sep2);
  const btnA=document.createElement("button");
  btnA.className="month-tab special2"+(mesSelecionado==="ANALISE"?" active":"");
  btnA.textContent="◎ Análise";
  btnA.onclick=()=>{ mesSelecionado="ANALISE"; renderTabs(); renderAnalise(); };
  bar.appendChild(btnA);
  const sep3=document.createElement("div"); sep3.className="tab-sep"; bar.appendChild(sep3);
  const btnG=document.createElement("button");
  btnG.className="month-tab special"+(mesSelecionado==="GERENCIAR"?" active":"");
  btnG.style.color="var(--amber)";
  if(mesSelecionado==="GERENCIAR") btnG.style.borderBottomColor="var(--amber)";
  btnG.textContent="✎ Gerenciar";
  btnG.onclick=()=>{ mesSelecionado="GERENCIAR"; renderTabs(); renderGerenciar(); };
  bar.appendChild(btnG);
}

// ── RENDER MÊS ────────────────────────────────────────────────
function renderMes(){
  buscaTermo = "";
  const dados=dadosPorMes[mesSelecionado]||[];
  const main=document.getElementById("mainContent");
  const receita0=receitasPorMes[mesSelecionado]||0;
  const recDetalhe0=receitasDetalhe[mesSelecionado]||[];

    main.innerHTML=`<div class="vazio-msg"><div style="font-size:40px">📭</div><p style="margin-top:10px;font-size:13px">Nenhum lançamento para <strong>${mesSelecionado}</strong>.</p></div>`;
    return;
  }
  if(!dados.length){
    main.innerHTML=`
    <div class="cards" style="grid-template-columns:repeat(2,1fr)">
      <div class="card" style="--card-accent:var(--green)">
        <div class="card-label">Receita</div>
        <div class="card-val green">${fmt(receita0)}</div>
        <div class="card-sub">${recDetalhe0.length} entrada(s)</div>
      </div>
      <div class="card" style="--card-accent:var(--muted)">
        <div class="card-label">Despesas</div>
        <div class="card-val" style="color:var(--muted)">R$ 0,00</div>
        <div class="card-sub">nenhum lançamento</div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">Receitas do mês</div>
      ${recDetalhe0.length
        ? recDetalhe0.map(r=>`<div class="rec-row"><span>${r.cat}${r.pagador?" · "+r.pagador:""}</span><span class="rec-val">${fmt(r.valor)}</span></div>`).join("")
        : `<div class="rec-row" style="color:var(--muted)">Nenhuma receita detalhada</div>`}
    </div>
    <div class="vazio-msg" style="padding:30px 0">
      <div style="font-size:32px">💸</div>
      <p style="margin-top:8px;font-size:13px;color:var(--muted)">Nenhuma despesa registrada em <strong>${mesSelecionado}</strong> ainda.</p>
    </div>`;
    return;
  }
  const receita=receitasPorMes[mesSelecionado]||0;
  const totalDesp=dados.reduce((s,l)=>s+l.valor,0);
  const saldo=receita-totalDesp;
  const recDetalhe=receitasDetalhe[mesSelecionado]||[];
  const porCat={};
  dados.forEach(l=>{ porCat[l.cat]=(porCat[l.cat]||0)+l.valor; });
  const catOrd=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const [maiorCat,maiorVal]=catOrd[0];
  const porConta={};
  dados.forEach(l=>{ porConta[l.conta]=(porConta[l.conta]||0)+l.valor; });
  const porDia={};
  dados.forEach(l=>{ const d=l.data.split("/")[0]; porDia[d]=(porDia[d]||0)+l.valor; });
  const diasOrd=Object.keys(porDia).sort((a,b)=>Number(a)-Number(b));
  const mesIdx=String(MESES_CONFIG.indexOf(mesSelecionado)+1).padStart(2,"0");
  const recHtml=recDetalhe.length
    ? recDetalhe.map(r=>`<div class="rec-row"><span>${r.cat}${r.pagador?" · "+r.pagador:""}</span><span class="rec-val">${fmt(r.valor)}</span></div>`).join("")
    : `<div class="rec-row" style="color:var(--muted);font-size:12px">Nenhuma receita registrada</div>`;

  main.innerHTML=`
  <div class="cards">
    <div class="card" style="--card-accent:var(--green)">
      <div class="card-label">Receita</div>
      <div class="card-val green">${fmt(receita)}</div>
      <div class="card-sub">${recDetalhe.length||0} entrada(s)</div>
    </div>
    <div class="card" style="--card-accent:var(--red)">
      <div class="card-label">Despesas</div>
      <div class="card-val red">${fmt(totalDesp)}</div>
      <div class="card-sub">${dados.length} lançamentos</div>
    </div>
    <div class="card" style="--card-accent:${saldo>=0?'var(--green)':'var(--red)'}">
      <div class="card-label">Saldo</div>
      <div class="card-val ${saldo>=0?'green':'red'}">${fmt(saldo)}</div>
      <div class="card-sub">receita − despesas</div>
    </div>
    <div class="card" style="--card-accent:var(--amber)">
      <div class="card-label">Maior Categoria</div>
      <div class="card-val amber">${fmt(maiorVal)}</div>
      <div class="card-sub">${maiorCat}</div>
    </div>
    <div class="card" style="--card-accent:var(--purple)">
      <div class="card-label">Média por dia</div>
      <div class="card-val purple">${fmt(totalDesp/diasOrd.length)}</div>
      <div class="card-sub">${diasOrd.length} dias com gasto</div>
    </div>
  </div>

  <div class="grid3">
    <div class="panel">
      <div class="panel-title">Receitas do mês</div>
      ${recHtml}
    </div>
    <div class="panel" style="grid-column:span 2">
      <div class="panel-title">
        <span>Por categoria</span>
        <span class="panel-title-hint">clique no gráfico ou na linha para filtrar</span>
      </div>
      <div class="cat-grid" style="display:grid;gap:16px;align-items:center">
        <div style="position:relative;height:170px"><canvas id="chartPizza" aria-label="Por categoria"></canvas></div>
        <div class="cat-list" id="catList"></div>
      </div>
    </div>
  </div>

  <div class="grid2">
    <div class="panel">
      <div class="panel-title">
        <span>Gasto por dia</span>
        <span class="panel-title-hint">clique para ver detalhes</span>
      </div>
      <div style="position:relative;height:190px"><canvas id="chartDia" aria-label="Gasto por dia"></canvas></div>
    </div>
    <div class="panel">
      <div class="panel-title">Por conta / cartão</div>
      <div id="contasList"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">
      <span>Lançamentos</span>
      <button onclick="abrirAnaliseMes()" style="background:var(--accent-bg);border:1px solid rgba(99,102,241,.3);color:var(--accent);padding:5px 13px;border-radius:8px;font-size:11px;font-family:'Inter',sans-serif;cursor:pointer;font-weight:600;transition:all .15s" onmouseover="this.style.opacity='.8'" onmouseout="this.style.opacity='1'">📊 Análise</button>
    </div>
    <div class="busca-wrap">
      <input class="busca-input" id="buscaInput" type="text" placeholder="Buscar por estabelecimento…" oninput="onBusca(this.value)">
      <button class="busca-clear" id="buscaClear" onclick="limparBusca()">✕</button>
    </div>
    <div class="filtros" id="filtrosDiv"></div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>Data</th><th>Estabelecimento</th><th>Categoria</th><th>Conta</th>
          <th style="text-align:right">Valor</th>
        </tr></thead>
        <tbody id="tblBody"></tbody>
      </table>
    </div>
  </div>`;

  // Contas
  const contasEl=document.getElementById("contasList");
  Object.entries(porConta).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{
    contasEl.innerHTML+=`<div class="conta-row"><span>${c}</span><span class="conta-val">${fmt(v)}</span></div>`;
  });

  // Filtros
  const cats=["Todos",...Object.keys(porCat).sort()];
  const filtrosEl=document.getElementById("filtrosDiv");
  cats.forEach(c=>{
    const btn=document.createElement("button");
    btn.className="filtro-btn"+(c===filtroAtivo?" active":"");
    btn.textContent=c;
    btn.onclick=()=>{ filtroAtivo=c; sincFiltros(dados); };
    filtrosEl.appendChild(btn);
  });

  renderTabela(dados);
  renderCatList(catOrd,totalDesp,dados);

  // Chart pizza
  const isDark=document.documentElement.getAttribute("data-theme")==="dark";
  const gridColor=isDark?"rgba(255,255,255,.06)":"rgba(0,0,0,.06)";
  const tickColor=isDark?"#5a6a82":"#8896b0";

  if(chartPizza)chartPizza.destroy();
  chartPizza=new Chart(document.getElementById("chartPizza"),{
    type:"doughnut",
    data:{labels:catOrd.map(([c])=>c),datasets:[{data:catOrd.map(([,v])=>v),backgroundColor:catOrd.map(([c])=>corHex(c)),borderWidth:2,borderColor:isDark?"#1e2433":"#ffffff",hoverOffset:8}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"60%",
      plugins:{legend:{display:false},tooltip:{backgroundColor:"#0f1117",borderColor:"rgba(255,255,255,.1)",borderWidth:1,padding:10,callbacks:{label:ctx=>" "+ctx.label+": "+fmt(ctx.parsed)+" ("+((ctx.parsed/totalDesp)*100).toFixed(1)+"%)"}}},
      onClick:(_,els)=>{
        if(els.length){
          const cat=catOrd[els[0].index][0];
          const itens=dados.filter(l=>l.cat===cat);
          abrirModalCat(cat,itens,totalDesp);
          filtroAtivo=filtroAtivo===cat?"Todos":cat;
          sincFiltros(dados);
        }
      }
    }
  });

  // Chart dia
  if(chartDia)chartDia.destroy();
  chartDia=new Chart(document.getElementById("chartDia"),{
    type:"bar",
    data:{labels:diasOrd.map(d=>d+"/"+mesIdx),datasets:[{data:diasOrd.map(d=>porDia[d]),backgroundColor:"rgba(248,113,113,.2)",borderColor:"#f87171",borderWidth:1.5,borderRadius:5,hoverBackgroundColor:"rgba(248,113,113,.4)"}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{backgroundColor:"#0f1117",borderColor:"rgba(255,255,255,.1)",borderWidth:1,padding:10,callbacks:{label:ctx=>" "+fmt(ctx.parsed.y)}}},
      scales:{
        x:{grid:{display:false},ticks:{color:tickColor,font:{size:10},maxRotation:45,autoSkip:false}},
        y:{grid:{color:gridColor},border:{dash:[4,4]},ticks:{color:tickColor,font:{size:10},callback:v=>"R$"+(v>=1000?(v/1000).toFixed(1)+"k":v)}}
      },
      onClick:(_,els)=>{
        if(!els.length) return;
        const dia=diasOrd[els[0].index];
        const label=dia+"/"+mesIdx;
        const itens=dados.filter(l=>l.data===label||l.data===dia+"/"+String(parseInt(mesIdx)));
        abrirModalDia(label,itens);
      }
    }
  });
}

// ── CAT LIST ──────────────────────────────────────────────────
function renderCatList(catOrd,totalDesp,dados){
  const el=document.getElementById("catList"); if(!el) return;
  el.innerHTML="";
  catOrd.forEach(([cat,val])=>{
    const pct=(val/totalDesp*100).toFixed(1);
    const div=document.createElement("div");
    div.className="cat-row"+(filtroAtivo===cat?" active-filter":"");
    div.innerHTML=`<span class="cat-label">${cat}</span>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%;background:${corHex(cat)}"></div></div>
      <span class="cat-val">${fmt(val)}</span>
      <span class="cat-pct">${pct}%</span>`;
    div.onclick=()=>{ filtroAtivo=filtroAtivo===cat?"Todos":cat; sincFiltros(dados); };
    el.appendChild(div);
  });
}

// ── SYNC FILTROS ──────────────────────────────────────────────
function sincFiltros(dados){
  const porCat={};
  dados.forEach(l=>{ porCat[l.cat]=(porCat[l.cat]||0)+l.valor; });
  const catOrd=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const totalDesp=dados.reduce((s,l)=>s+l.valor,0);
  renderCatList(catOrd,totalDesp,dados);
  renderTabela(dados);
  document.querySelectorAll(".filtro-btn").forEach(b=>{
    b.className="filtro-btn"+(b.textContent===filtroAtivo?" active":"");
    b.onclick=()=>{ filtroAtivo=b.textContent; sincFiltros(dados); };
  });
}

// ── BUSCA ─────────────────────────────────────────────────────
let buscaTermo = "";
let _dadosAtivos = [];

function onBusca(val){
  buscaTermo = val.trim().toLowerCase();
  document.getElementById("buscaClear").classList.toggle("vis", buscaTermo.length > 0);
  renderTabela(_dadosAtivos);
}
function limparBusca(){
  buscaTermo = "";
  document.getElementById("buscaInput").value = "";
  document.getElementById("buscaClear").classList.remove("vis");
  renderTabela(_dadosAtivos);
}

// ── TABELA ────────────────────────────────────────────────────
function renderTabela(dados){
  _dadosAtivos = dados;
  let filtrados = filtroAtivo==="Todos" ? dados : dados.filter(l=>l.cat===filtroAtivo);
  if(buscaTermo) filtrados = filtrados.filter(l=>(l.estab||"").toLowerCase().includes(buscaTermo));
  const total=filtrados.reduce((s,l)=>s+l.valor,0);
  const tbl=document.getElementById("tblBody"); if(!tbl) return;
  tbl.innerHTML=filtrados.sort((a,b)=>a.data.localeCompare(b.data)).map(l=>`
    <tr>
      <td class="td-data">${l.data}</td>
      <td style="font-weight:500">${l.estab}</td>
      <td><span class="badge ${corCls(l.cat)}">${l.cat}</span></td>
      <td style="font-size:11px;color:var(--muted)">${l.conta}</td>
      <td class="td-val">${fmt(l.valor)}</td>
    </tr>`).join("")+
  `<tr>
    <td colspan="4" style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;padding-top:14px">
      ${buscaTermo?`"${buscaTermo}" — `:filtroAtivo==="Todos"?"Total geral":"Subtotal — "+filtroAtivo}${buscaTermo&&filtroAtivo!=="Todos"?" · "+filtroAtivo:""}
    </td>
    <td class="td-val" style="padding-top:14px;font-size:14px">${fmt(total)}</td>
  </tr>`;
}

// ── ANÁLISE ───────────────────────────────────────────────────
function renderAnalise(){
  const main=document.getElementById("mainContent");
  const mesesComDados=MESES_CONFIG.filter(m=>dadosPorMes[m]);
  if(!mesesComDados.length){ main.innerHTML=`<div class="vazio-msg">📭</div>`; return; }

  const todasDesp=mesesComDados.flatMap(m=>dadosPorMes[m]);
  const totalDesp=todasDesp.reduce((s,l)=>s+l.valor,0);
  const totalRec=mesesComDados.reduce((s,m)=>s+(receitasPorMes[m]||0),0);
  const saldoGeral=totalRec-totalDesp;
  const receitaRef=mesesComDados.reduce((s,m)=>s+SALARIO_BRUTO(m),0);
  const salarioMedioMes=receitaRef/mesesComDados.length;
  const txPoupanca=((receitaRef-totalDesp)/receitaRef)*100;
  const comprometimento=(totalDesp/receitaRef)*100;
  const mediaMensal=totalDesp/mesesComDados.length;
  const porCat={};
  todasDesp.forEach(l=>{ porCat[l.cat]=(porCat[l.cat]||0)+l.valor; });
  const catOrd=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const maiorCat=catOrd[0];
  const porConta={};
  todasDesp.forEach(l=>{ porConta[l.conta]=(porConta[l.conta]||0)+l.valor; });
  const contaOrd=Object.entries(porConta).sort((a,b)=>b[1]-a[1]);
  const porDia={};
  todasDesp.forEach(l=>{ porDia[l.data]=(porDia[l.data]||0)+l.valor; });
  const diaOrd=Object.entries(porDia).sort((a,b)=>b[1]-a[1]);
  const diaMaisCaro=diaOrd[0];
  const porEstab={};
  todasDesp.forEach(l=>{ if(l.estab) porEstab[l.estab]=(porEstab[l.estab]||0)+1; });
  const estabOrd=Object.entries(porEstab).sort((a,b)=>b[1]-a[1]);

  const alertas=[];
  if(txPoupanca<10) alertas.push({icon:"⚠️",titulo:"Taxa de poupança baixa",desc:`Com base no salário de referência, você está poupando apenas ${txPoupanca.toFixed(1)}%. O ideal é pelo menos 20%.`});
  if(maiorCat&&maiorCat[1]/receitaRef>0.15) alertas.push({icon:"🍔",titulo:`${maiorCat[0]} comprometeu ${(maiorCat[1]/receitaRef*100).toFixed(1)}% do salário`,desc:`${fmt(maiorCat[1])} gastos em ${maiorCat[0]}. Avalie se há como reduzir.`});
  if(comprometimento>80) alertas.push({icon:"🔴",titulo:"Alto comprometimento da renda",desc:`${comprometimento.toFixed(1)}% do salário foi comprometido. O recomendado é abaixo de 70%.`});
  if(saldoGeral<0) alertas.push({icon:"🔴",titulo:"Saldo negativo",desc:`Despesas superaram a receita em ${fmt(Math.abs(saldoGeral))}.`});
  if(porCat["Outros"]&&porCat["Outros"]/totalDesp>0.2) alertas.push({icon:"📦",titulo:"Muitos gastos em 'Outros'",desc:`${fmt(porCat["Outros"])} sem categorização clara. Vale detalhar melhor.`});
  if(alertas.length===0) alertas.push({icon:"✅",titulo:"Finanças sob controle",desc:"Nenhum alerta crítico encontrado. Continue monitorando!"});

  const dicas=[];
  if(estabOrd.length>0) dicas.push({icon:"🏪",texto:`Você visitou <strong>${estabOrd[0][0]}</strong> ${estabOrd[0][1]}x — avalie se esse gasto é essencial.`});
  if(diaMaisCaro) dicas.push({icon:"📅",texto:`Dia mais caro: <strong>${diaMaisCaro[0]}</strong> com ${fmt(diaMaisCaro[1])}. Identifique o que gerou esse pico.`});
  dicas.push({icon:"💡",texto:`Média mensal de gastos: <strong>${fmt(mediaMensal)}</strong> — <strong>${(mediaMensal/salarioMedioMes*100).toFixed(1)}%</strong> do salário bruto médio.`});
  dicas.push({icon:"🎯",texto:`Poupando 20% do salário médio (${fmt(salarioMedioMes*0.2)}/mês), você teria <strong>${fmt(salarioMedioMes*0.2*12)}</strong> em 12 meses.`});
  if(saldoGeral>0) dicas.push({icon:"📈",texto:`Nesse ritmo, você acumulará <strong>${fmt(saldoGeral/mesesComDados.length*12)}</strong> em 12 meses.`});

  main.innerHTML=`
  <div class="analise-grid">

    <div class="analise-panel full">
      <div class="analise-panel-titulo">Visão geral — Jan–Jul: ${fmt(3200)}/mês · Ago em diante: ${fmt(4000)}/mês</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
        <div class="card" style="--card-accent:var(--blue);margin:0"><div class="card-label">Salário Médio Ref.</div><div class="card-val blue">${fmt(salarioMedioMes)}</div><div class="card-sub">média ponderada</div></div>

let gerTipo="DESPESAS", gerMes="", pendingDelete=null, editando=null;

function renderGerenciar(){
  const main=document.getElementById("mainContent");
  const mesesComDados=MESES_CONFIG.filter(m=>dadosPorMes[m]||receitasPorMes[m]);
  if(!gerMes) gerMes=mesesComDados[mesesComDados.length-1]||MESES_CONFIG[0];

  const opsMeses=mesesComDados.map(m=>`<option value="${m}"${m===gerMes?" selected":""}>${m}</option>`).join("");

  main.innerHTML=`
  <div class="panel">
    <div class="ger-filtros">
      <div class="ger-tipo-toggle">
        <button class="ger-tipo-btn ${gerTipo==="DESPESAS"?"ativo-desp":""}" id="gerBtnDesp" onclick="gerSetTipo('DESPESAS')">💸 Despesas</button>
        <button class="ger-tipo-btn ${gerTipo==="RECEITAS"?"ativo-rec":""}"  id="gerBtnRec"  onclick="gerSetTipo('RECEITAS')">💰 Receitas</button>
      </div>
      <label>Mês:</label>

    </div>
    <div style="overflow-x:auto">
      <table class="ger-table" style="width:100%;border-collapse:collapse" id="gerTabela"></table>
    </div>
  </div>`;

  _preencherGerTabela();
}

function gerSetTipo(tipo){
  gerTipo=tipo;
  document.getElementById("gerBtnDesp").className="ger-tipo-btn"+(tipo==="DESPESAS"?" ativo-desp":"");
  document.getElementById("gerBtnRec").className ="ger-tipo-btn"+(tipo==="RECEITAS"?" ativo-rec":"");
  _preencherGerTabela();
}

function _preencherGerTabela(){
  const tabela=document.getElementById("gerTabela");
  if(!tabela) return;
  const isDesp=gerTipo==="DESPESAS";
  const itens=isDesp
    ? (dadosPorMes[gerMes]||[])
    : (receitasDetalhe[gerMes]||[]);

  if(!itens.length){
    tabela.innerHTML=`<tr><td colspan="5" class="ger-vazio">Nenhum lançamento em ${gerMes}.</td></tr>`;
    return;
  }

  const thead=isDesp
    ? `<tr><th>Data</th><th>Estabelecimento</th><th>Categoria</th><th>Conta</th><th style="text-align:right">Valor</th><th></th></tr>`
    : `<tr><th>Data</th><th>Pagador</th><th>Categoria</th><th style="text-align:right">Valor</th><th></th></tr>`;

  const tbody=itens.map((l,i)=>{
    const val=`<span style="font-family:'JetBrains Mono',monospace;color:${isDesp?"var(--red)":"var(--green)"};font-weight:700">${fmt(l.valor)}</span>`;
    const cols=isDesp
      ? `<td class="td-data">${l.data}</td><td>${l.estab||"—"}</td><td><span class="badge ${corCls(l.cat)}">${l.cat}</span></td><td style="color:var(--muted);font-size:11px">${l.conta||"—"}</td><td style="text-align:right">${val}</td>`
      : `<td class="td-data">${l.data}</td><td>${l.pagador||"—"}</td><td><span class="badge b-dyn">${l.cat}</span></td><td style="text-align:right">${val}</td>`;
    return `<tr>
      ${cols}
      <td>
        <div class="ger-acoes">
          <button class="btn-edit" onclick="abrirEdit(${i},'${gerTipo}')">✎ Editar</button>
          <button class="btn-del"  onclick="abrirConfirmDelete(${i},'${gerTipo}')">✕ Excluir</button>
        </div>
      </td>
    </tr>`;
  }).join("");

  tabela.innerHTML=`<thead>${thead}</thead><tbody>${tbody}</tbody>`;
}

function abrirConfirmDelete(i,tipo){
  const itens=tipo==="DESPESAS"?(dadosPorMes[gerMes]||[]):(receitasDetalhe[gerMes]||[]);
  const l=itens[i];
  pendingDelete={i,tipo,item:l};
  const desc=tipo==="DESPESAS"
    ? `<strong>${l.estab||l.cat}</strong> · ${fmt(l.valor)} · ${l.data}`
    : `<strong>${l.pagador||l.cat}</strong> · ${fmt(l.valor)} · ${l.data}`;
  document.getElementById("confirmDesc").innerHTML=`Esta ação não pode ser desfeita.<br><br>${desc}`;
  document.getElementById("confirmDelBtn").disabled=false;
  document.getElementById("confirmDelBtn").textContent="Excluir";
  document.getElementById("confirmOverlay").classList.add("open");
}
function fecharConfirm(){
  document.getElementById("confirmOverlay").classList.remove("open");
  pendingDelete=null;
}
async function confirmarDelete(){
  if(!pendingDelete) return;
  const btn=document.getElementById("confirmDelBtn");
  btn.disabled=true; btn.textContent="Excluindo...";
  const {item,tipo}=pendingDelete;
  try{
    await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:"joao771964",acao:"deletar",aba:tipo,rowIndex:item.rowIndex}),
      mode:"no-cors"
    });
    fecharConfirm();
    await sincronizarSilencioso();
    renderGerenciar();
  }catch(e){
    btn.disabled=false; btn.textContent="Excluir";
    alert("Erro ao excluir: "+e.message);
  }
}

  const {item,tipo}=editando;

  const dataVal=document.getElementById("editData").value;
  const valor=parseFloat(document.getElementById("editValor").value);

  const estab=document.getElementById("editEstab").value.trim();

// Sync silencioso (sem spinner no main)
async function sincronizarSilencioso(){
  try{
    const [resD,resR]=await Promise.all([
      fetch(API_URL+"?aba="+encodeURIComponent(ABA_DESPESAS)+"&token=joao771964").then(r=>r.json()),
      fetch(API_URL+"?aba="+encodeURIComponent(ABA_RECEITAS)+"&token=joao771964").then(r=>r.json())
    ]);
    processarDadosSilencioso(resD,resR);
  }catch(e){ console.warn("Sync silencioso falhou",e); }
}
function processarDadosSilencioso(rawDesp,rawRec){
  dadosPorMes={}; receitasPorMes={}; receitasDetalhe={};
  rawDesp.forEach((row,i)=>{
    const p=parseData(row["DATA"]); if(!p||!p.mesNome) return;
    const valor=parseFloat(row["VALOR"])||0; if(!valor) return;
    if(!dadosPorMes[p.mesNome]) dadosPorMes[p.mesNome]=[];
    dadosPorMes[p.mesNome].push({rowIndex:i,data:p.dataStr,cat:(row["CATEGORIA"]||"Outros").trim(),valor,conta:(row["CONTA"]||"").trim(),estab:(row["ESTABELECIMENTO"]||"").trim()});
  });
  rawRec.forEach((row,i)=>{
    const p=parseData(row["DATA"]); if(!p||!p.mesNome) return;
    const valor=parseFloat(row["VALOR"])||0; if(!valor) return;
    receitasPorMes[p.mesNome]=(receitasPorMes[p.mesNome]||0)+valor;
    if(!receitasDetalhe[p.mesNome]) receitasDetalhe[p.mesNome]=[];
    receitasDetalhe[p.mesNome].push({rowIndex:i,cat:(row["CATEGORIA"]||"Receita").trim(),valor,pagador:(row["PAGADOR"]||"").trim(),data:p.dataStr});
  });
}

async function salvarLanc(){
  const data    = document.getElementById("lancData").value;

  const cat     = document.getElementById("lancCategoria").value;

  if(!data || !valor || valor <= 0){
    status.className = "lanc-status err";
    status.textContent = "Preencha a data e um valor válido.";
    return;
  }

  // Formata data pra DD/MM/YYYY
  const [ano,mes,dia] = data.split("-");
  const dataFmt = `${dia}/${mes}/${ano}`;

  saveBtn.disabled = true;
  status.className = "lanc-status";
  status.textContent = "";

  const payload = {
    aba: tipoLanc,
    token: "joao771964",
    data: dataFmt,
    valor,
    categoria: cat,
    ...(tipoLanc === "DESPESAS" ? { estabelecimento: estab, conta } : { pagador }),
  };

  try{

      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      mode: "no-cors"
    });
    // no-cors = opaque response, então assumimos sucesso se não lançou
    status.className = "lanc-status ok";
    status.textContent = "✓ Lançamento salvo! Sincronizando...";
    setTimeout(()=>{ fecharLanc(); sincronizar(); }, 1400);
  }catch(e){
    status.className = "lanc-status err";
    status.textContent = "Erro ao salvar: " + e.message;
    saveBtn.disabled = false;
  }
}

// ── ANÁLISE DO MÊS (MODAL) ───────────────────────────────────
function abrirAnaliseMes(){
  const mes = mesSelecionado;
  const dados = dadosPorMes[mes] || [];
  const receita = receitasPorMes[mes] || 0;
  const recDetalhe = receitasDetalhe[mes] || [];

  document.getElementById("analiseMesTitulo").textContent = "Análise — " + mes;

  if(!dados.length && !receita){
    document.getElementById("analiseMesBody").innerHTML = `<div class="vazio-msg" style="padding:40px 0">📭 Nenhum dado para ${mes}.</div>`;
    document.getElementById("analiseMesOverlay").classList.add("open");
    return;
  }

  const totalDesp = dados.reduce((s,l)=>s+l.valor, 0);
  const saldo = receita - totalDesp;
  const comprometido = receita > 0 ? (totalDesp/receita*100) : 0;
  const txPoupanca = receita > 0 ? ((receita-totalDesp)/receita*100) : 0;

  const porCat = {};
  dados.forEach(l=>{ porCat[l.cat]=(porCat[l.cat]||0)+l.valor; });
  const catOrd = Object.entries(porCat).sort((a,b)=>b[1]-a[1]);

  const porConta = {};
  dados.forEach(l=>{ porConta[l.conta]=(porConta[l.conta]||0)+l.valor; });
  const contaOrd = Object.entries(porConta).sort((a,b)=>b[1]-a[1]);

  const porDia = {};
  dados.forEach(l=>{ const d=l.data.split("/")[0]; porDia[d]=(porDia[d]||0)+l.valor; });
  const diasOrd = Object.keys(porDia).sort((a,b)=>Number(a)-Number(b));
  const diaMax = diasOrd.length ? diasOrd.reduce((m,d)=>porDia[d]>porDia[m]?d:m, diasOrd[0]) : "—";
  const diaMin = diasOrd.length ? diasOrd.reduce((m,d)=>porDia[d]<porDia[m]?d:m, diasOrd[0]) : "—";
  const mediaDia = totalDesp / (diasOrd.length || 1);
  const mesIdx = String(MESES_CONFIG.indexOf(mes)+1).padStart(2,"0");

  const alertas = [];
  if(catOrd.length && (catOrd[0][1]/totalDesp) > 0.4)
    alertas.push({icon:"⚠️", titulo:`${catOrd[0][0]} consome ${(catOrd[0][1]/totalDesp*100).toFixed(0)}% das despesas`, desc:`${fmt(catOrd[0][1])} nessa categoria. Considere revisar.`});
  if(receita > 0 && comprometido > 80)
    alertas.push({icon:"🔴", titulo:"Alto comprometimento da receita", desc:`${comprometido.toFixed(1)}% da receita foi para despesas.`});
  if(saldo < 0)
    alertas.push({icon:"🚨", titulo:"Saldo negativo no mês", desc:`Despesas superaram as receitas em ${fmt(Math.abs(saldo))}.`});
  if(receita > 0 && txPoupanca >= 20)
    alertas.push({icon:"✅", titulo:"Boa taxa de poupança", desc:`Você guardou ${txPoupanca.toFixed(1)}% da receita.`});
  if(dados.length){
    const maior = [...dados].sort((a,b)=>b.valor-a.valor)[0];
    if(maior.valor/totalDesp > 0.3)
      alertas.push({icon:"💡", titulo:`Maior gasto único: ${fmt(maior.valor)}`, desc:`${maior.estab||maior.cat} representa ${(maior.valor/totalDesp*100).toFixed(0)}% do total.`});
  }
  if(!alertas.length) alertas.push({icon:"😊", titulo:"Mês sem alertas", desc:"Seus gastos estão dentro do esperado."});

  const maiorGasto = dados.length ? Math.max(...dados.map(l=>l.valor)) : 0;
  const menorGasto = dados.length ? Math.min(...dados.map(l=>l.valor)) : 0;
  const ticketMedio = dados.length ? totalDesp/dados.length : 0;

  document.getElementById("analiseMesBody").innerHTML = `
    <div class="am-kpis">
      <div class="am-kpi">
        <div class="am-kpi-label">Receita</div>
        <div class="am-kpi-val" style="color:var(--green)">${fmt(receita)}</div>
        <div class="am-kpi-sub">${recDetalhe.length} entrada(s)</div>
      </div>
      <div class="am-kpi">
        <div class="am-kpi-label">Despesas</div>
        <div class="am-kpi-val" style="color:var(--red)">${fmt(totalDesp)}</div>
        <div class="am-kpi-sub">${dados.length} lançamentos</div>
      </div>
      <div class="am-kpi">
        <div class="am-kpi-label">Saldo</div>
        <div class="am-kpi-val" style="color:${saldo>=0?'var(--green)':'var(--red)'}">${fmt(saldo)}</div>
        <div class="am-kpi-sub">${saldo>=0?'positivo':'negativo'}</div>
      </div>
      <div class="am-kpi">
        <div class="am-kpi-label">Comprometido</div>
        <div class="am-kpi-val" style="color:${comprometido>80?'var(--red)':comprometido>60?'var(--amber)':'var(--green)'}">${receita>0?comprometido.toFixed(1)+"%":"—"}</div>
        <div class="am-kpi-sub">da receita</div>
      </div>
      <div class="am-kpi">
        <div class="am-kpi-label">Taxa de poupança</div>
        <div class="am-kpi-val" style="color:${txPoupanca>=20?'var(--green)':txPoupanca>=10?'var(--amber)':'var(--red)'}">${receita>0?txPoupanca.toFixed(1)+"%":"—"}</div>
        <div class="am-kpi-sub">${txPoupanca>=20?'excelente':txPoupanca>=10?'aceitável':'abaixo do ideal'}</div>
      </div>
      <div class="am-kpi">
        <div class="am-kpi-label">Média por dia</div>
        <div class="am-kpi-val" style="color:var(--amber)">${fmt(mediaDia)}</div>
        <div class="am-kpi-sub">${diasOrd.length} dias com gasto</div>
      </div>
    </div>

    <div class="am-panel">
      <div class="am-section-title">⚡ Alertas automáticos</div>
      ${alertas.map(a=>`<div class="am-alerta"><span class="am-alerta-icon">${a.icon}</span><div class="am-alerta-body"><strong>${a.titulo}</strong><span>${a.desc}</span></div></div>`).join("")}
    </div>

    <div class="am-panel">
      <div class="am-section-title">🏆 Por categoria</div>
      ${catOrd.map(([cat,val])=>{
        const pct=(val/totalDesp*100).toFixed(1);
        return `<div class="am-cat-row">
          <span class="am-cat-label">${cat}</span>
          <div class="am-cat-track"><div class="am-cat-fill" style="width:${pct}%;background:${corHex(cat)}"></div></div>
          <span class="am-cat-val">${fmt(val)}</span>
          <span class="am-cat-pct">${pct}%</span>
        </div>`;
      }).join("")}
    </div>

    <div class="am-panel">
      <div class="am-section-title">📊 Estatísticas</div>
      <div class="am-stat-row"><span>Maior gasto único</span><span class="am-stat-val" style="color:var(--red)">${fmt(maiorGasto)}</span></div>
      <div class="am-stat-row"><span>Menor gasto único</span><span class="am-stat-val" style="color:var(--green)">${fmt(menorGasto)}</span></div>
      <div class="am-stat-row"><span>Ticket médio por lançamento</span><span class="am-stat-val" style="color:var(--blue)">${fmt(ticketMedio)}</span></div>
      <div class="am-stat-row"><span>Dia mais caro</span><span class="am-stat-val" style="color:var(--red)">${diaMax !== "—" ? diaMax+"/"+mesIdx+" — "+fmt(porDia[diaMax]||0) : "—"}</span></div>
      <div class="am-stat-row"><span>Dia mais barato</span><span class="am-stat-val" style="color:var(--green)">${diaMin !== "—" ? diaMin+"/"+mesIdx+" — "+fmt(porDia[diaMin]||0) : "—"}</span></div>
      <div class="am-stat-row"><span>Categorias diferentes</span><span class="am-stat-val">${catOrd.length}</span></div>
    </div>

    <div class="am-panel">
      <div class="am-section-title">💳 Por conta / cartão</div>
      ${contaOrd.map(([conta,val])=>`
        <div class="am-cat-row">
          <span class="am-cat-label">${conta||"Sem conta"}</span>
          <div class="am-cat-track"><div class="am-cat-fill" style="width:${(val/contaOrd[0][1]*100).toFixed(0)}%;background:var(--blue)"></div></div>
          <span class="am-cat-val">${fmt(val)}</span>
          <span class="am-cat-pct">${(val/totalDesp*100).toFixed(1)}%</span>
        </div>`).join("")}
    </div>
  `;

  document.getElementById("analiseMesOverlay").classList.add("open");
}

function fecharAnaliseMes(){
  document.getElementById("analiseMesOverlay").classList.remove("open");
}

sincronizar();
</script>
